<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PetHero - {% block title %}{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script>
        // Aqui fica aquele seu tailwind.config que o Stitch criou
        tailwind.config = {
            theme: { extend: { colors: { "primary": "#2b9dee", "primary-dark": "#1a7bc0" } } }
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark">
    
    <header class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-md border-b border-[#e7eef3]">
        <div class="px-4 md:px-10 py-3 flex items-center justify-between mx-auto max-w-7xl">
            <div class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined text-2xl">pets</span>
                <h2 class="text-xl font-bold text-slate-900">PetHero</h2>
            </div>
            <nav class="hidden md:flex items-center gap-6">
                <a href="{{ url_for('index') }}" class="hover:text-primary">Home</a>
                <a href="{{ url_for('reportar') }}" class="hover:text-primary">Reportar</a>
                <a href="{{ url_for('login') }}" class="hover:text-primary">Login</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-slate-500">
        © 2026 PetHero
    </footer>

</body>
</html>
