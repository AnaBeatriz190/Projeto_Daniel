<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PetHero - Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { "primary": "#2b9dee", "primary-dark": "#1a8cd8" } } } }
    </script>
</head>
<body class="bg-[#f6f7f8] font-sans antialiased">
    <div class="flex flex-col min-h-screen">
        <header class="bg-white border-b p-4 flex justify-between items-center px-10">
            <a href="/" class="flex items-center gap-2 text-primary hover:opacity-80 transition-all">
                <span class="material-symbols-outlined text-3xl">pets</span>
                <h2 class="text-xl font-bold text-slate-900">PetHero</h2>
            </a>
            <a href="/" class="text-sm font-medium text-slate-600 hover:text-primary">Voltar para Home</a>
        </header>

        <main class="flex-grow flex items-center justify-center p-6">
            <div class="bg-white rounded-[2.5rem] shadow-xl w-full max-w-[450px] overflow-hidden border border-slate-100">
                <div class="flex border-b">
                    <a href="/login" class="flex-1 text-center py-5 text-slate-400 hover:text-slate-600 font-bold">Login</a>
                    <div class="flex-1 text-center py-5 border-b-4 border-primary font-bold text-primary bg-blue-50/30">Cadastro</div>
                </div>

                <div class="p-8">
                    <h1 class="text-2xl font-black text-center mb-2">Seja um Herói!</h1>
                    <p class="text-center text-slate-500 mb-8 text-sm">Crie sua conta para começar a ajudar.</p>

                    <form action="/cadastro" method="POST" class="flex flex-col gap-5">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-slate-700 ml-1 uppercase">Nome Completo</label>
                            <input type="text" name="nome" required class="rounded-xl border-slate-200 h-12 px-4 focus:ring-primary focus:border-primary" placeholder="Seu Nome">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-slate-700 ml-1 uppercase">E-mail</label>
                            <input type="email" name="email" required class="rounded-xl border-slate-200 h-12 px-4 focus:ring-primary focus:border-primary" placeholder="seu@email.com">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-slate-700 ml-1 uppercase">Senha</label>
                            <input type="password" name="senha" required class="rounded-xl border-slate-200 h-12 px-4 focus:ring-primary focus:border-primary" placeholder="••••••••">
                        </div>
                        
                        <button type="submit" class="bg-primary hover:bg-primary-dark text-white h-14 rounded-2xl font-black shadow-lg shadow-primary/20 transition-all mt-4 uppercase text-sm tracking-widest">
                            Criar Conta
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
